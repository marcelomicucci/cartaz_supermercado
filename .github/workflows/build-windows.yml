name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v5
        with:
          name: CartazFacil-Windows
          path: out/make/squirrel.windows/x64/*
          if-no-files-found: error
